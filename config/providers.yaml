# Free-tier LLM provider catalogue for the model router (scraper/router.py).
#
# WHY THIS IS CONFIG, NOT CODE
# Free providers rename and retire models constantly — Groq deprecated
# llama-3.1-8b-instant and llama-3.3-70b-versatile in June 2026, DeepSeek
# retired "deepseek-chat" in July 2026 and cost us a whole extraction window
# (docs/wiki/pages/post-mortems/2026-07-deepseek-model-retired.md). Editing a
# model name here is a code change like any other: edit it in git and deploy.
# config/ is NOT a persisted volume — an edit made through /admin/config is
# gone at the next deploy (proven 2026-08-18, when settings changed in the
# repository reached production and UI edits did not).
#
# HOW THE ROUTER USES THIS
# Routing happens BEFORE generation, not as a cascade: the router picks the
# highest-quality model that still has quota and calls it once. Cascades pay the
# cheap model's generation before every escalation decision, and a pre-generation
# router beat the best cascade policy on 4 of 5 datasets in arXiv:2605.06350.
# See docs/wiki/sources/2026-08-16-llm-routing-arxiv-research.md.
#
# FIELDS
#   enabled       false parks a provider without deleting its config.
#   api_key_env   Missing/empty env var → the provider is skipped silently.
#                 That is the normal state for one we have not signed up for.
#   base_url      Must speak the OpenAI /chat/completions contract.
#   paid          true = costs money. The router only reaches these when
#                 `router.allow_paid` is on; DeepSeek is parked by default.
#   quality       0-100 score for this model on OUR task. Most are now MEASURED
#                 by scripts/score_providers.py against a golden set of our own
#                 cached pages (2026-08-16), not read off a leaderboard. Treat as a weak prior, not truth: LLMStructBench
#                 (arXiv:2602.14743) found prompting strategy matters more than
#                 model size for JSON extraction, so a leaderboard rank is a
#                 poor proxy. `scripts/score_providers.py` overwrites these with
#                 measured scores from our own golden set — do that before
#                 trusting the ordering.
#   tpd           Tokens per day, 0 = unknown. For several free tiers this is
#                 the ceiling that actually binds and a request count cannot
#                 express it: Groq allows 14,400 requests but only 200,000
#                 tokens, and on 2026-08-20 it refused with
#                 "TPD: Limit 200000, Used 199087" after about 390 calls while
#                 the catalogue planned for 13,680. Read from the provider's own
#                 refusal, not from a docs page.
#   rpm / rpd     Published free-tier limits (2026-08). Several providers
#                 stopped publishing numbers, so these are conservative
#                 starting points; the ledger LEARNS the real limit from 429s
#                 and persists it, which is what actually governs routing.
#   json_mode     false = the provider rejects response_format=json_object;
#                 the router falls back to prompt-only JSON instructions.

router:
  # Master switch. Off → the old single-provider DeepSeek path, unchanged.
  enabled: true
  # Paid providers are parked: free capacity is used first and, for now, only.
  # Flip to true to let the router fall through to DeepSeek when every free
  # provider is spent.
  allow_paid: false
  # Re-extracting an already-processed page is only ever a filler for quota that
  # would otherwise expire unused. New pages always come first; a page is
  # re-extracted only when an available model scores at least this many points
  # above the one that produced the cached result.
  upgrade_min_gain: 8
  # Hard ceiling on re-extraction calls per run, so an upgrade sweep can never
  # crowd out the next day's new work.
  upgrade_max_per_run: 500

providers:

  # ── Groq ──────────────────────────────────────────────────────────────────
  # Fastest free inference; the most generous daily request budget of the set.
  - name: groq
    enabled: true
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    rpm: 30
    rpd: 14400
    # Measured from Groq's own 429 on 2026-08-20: "tokens per day (TPD):
    # Limit 200000". This, not rpd, is what ends Groq's day.
    tpd: 200000
    models:
      - model: openai/gpt-oss-120b
        quality: 62
      - model: qwen/qwen3.6-27b
        quality: 55
      - model: openai/gpt-oss-20b
        quality: 67

  # ── Cerebras ──────────────────────────────────────────────────────────────
  # Very fast, large daily token budget, smaller catalogue than Groq.
  # DISABLED 2026-08-23: Cerebras ended its free API tier on 2026-08-17 and
  # moved existing accounts to a credit-based plan that requires a payment
  # method. Every call since answers HTTP 402 "billing limit" — 283 of them on
  # 2026-08-22, all refused, and because gemma-4-31b scores 80 it was the
  # router's first pick each time. Re-enable only if the account is put on a
  # paid plan, and then move it behind `router.allow_paid` where paid providers
  # belong. The ledger now blocks a 402 provider for the rest of the UTC day,
  # so this line saves one wasted first-choice call a day, not the whole loss.
  - name: cerebras
    enabled: false
    api_key_env: CEREBRAS_API_KEY
    base_url: https://api.cerebras.ai/v1
    rpm: 30
    rpd: 1000
    models:
      - model: gpt-oss-120b
        quality: 44
      - model: gemma-4-31b
        quality: 80
      # llama-4-scout-17b-16e-instruct removed 2026-08-16: 404 model_not_found
      # in preflight. The other two Cerebras models serve fine — this is a name
      # that does not exist here, not an account problem.

  # ── Google Gemini (AI Studio) ─────────────────────────────────────────────
  # Reached through Google's OpenAI-compatibility endpoint so it needs no
  # separate client. Highest published daily request allowance.
  - name: gemini
    enabled: true
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    # 10, not 15. Google publishes 15 RPM for Flash-Lite but 10 for Flash, and
    # this is one number for both models: pacing at the higher figure means the
    # faster model is always slightly over its limit. On 2026-08-22 Gemini took
    # **301** 429s across 1,200 calls and the breaker had it blocked with 924
    # requests still unspent. There is no published tokens-per-day cap to model
    # here — the limits are RPM, TPM and RPD — so `tpd` stays unset.
    rpm: 10
    rpd: 1500
    models:
      - model: gemini-3.6-flash
        quality: 64
      - model: gemini-3.5-flash-lite
        quality: 63

  # ── Mistral ───────────────────────────────────────────────────────────────
  - name: mistral
    enabled: true
    api_key_env: MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    rpm: 20
    rpd: 500
    models:
      - model: mistral-small-latest
        quality: 80
      - model: open-mistral-nemo
        quality: 76

  # ── OpenRouter (`:free` models) ───────────────────────────────────────────
  # One key, many models — but the tightest free request budget of the set, so
  # it sits low in the effective order despite decent model quality.
  - name: openrouter
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    rpm: 20
    rpd: 50
    models:
      - model: nvidia/nemotron-3-super-120b-a12b:free
        quality: 58
      - model: google/gemma-4-31b-it:free
        quality: 52
      - model: openai/gpt-oss-20b:free
        quality: 45

  # ── GitHub Models ─────────────────────────────────────────────────────────
  # DISABLED 2026-08-16: the API answers 410 with
  # {"code":"github_models_retirement_brownout"} — the service is being retired,
  # not rate limited. Kept here rather than deleted so the decision is visible.
  - name: github
    enabled: false
    api_key_env: GITHUB_MODELS_TOKEN
    base_url: https://models.github.ai/inference
    rpm: 10
    rpd: 150
    models:
      - model: openai/gpt-4.1-mini
        quality: 57
      - model: meta/Llama-3.3-70B-Instruct
        quality: 47

  # ── DeepSeek (paid — parked) ──────────────────────────────────────────────
  # The incumbent. Kept last and gated behind router.allow_paid so free capacity
  # is always spent first. Its model/fingerprint pinning still lives in
  # settings.yaml under `deepseek:`.
  - name: deepseek
    enabled: true
    paid: true
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    rpm: 60
    rpd: 100000
    models:
      - model: deepseek-v4-flash
        quality: 66
