deepseek:
  model: deepseek-chat
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 8000
  rate_limit_seconds: 1.0

groq:
  model: llama-3.3-70b-versatile
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 3000
  rate_limit_seconds: 7.0

search:
  results_per_query: 10
  max_pages_per_topic: 5
  rate_limit_seconds: 1.5
  # "live" = instant, $2/1K queries. "standard" = task queue, $0.6/1K (70% cheaper)
  # but each query takes ~0.5-5 minutes — only sensible for long unattended sweeps.
  dataforseo_mode: live

fetch:
  timeout_seconds: 15
  min_text_length: 100
  max_concurrent: 3
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - reddit.com
  playwright_domains: []

pipeline:
  commit_after_run: false
  push_after_commit: false
  test_mode: false
  test_cities:
    - Szentendre
    - Budapest
    - London
  enrich_communities: true
  # Topics searched for cities marked `topic_tier: core` in cities.yaml (small towns
  # where niche topics can't yield results). Tiered-out pairs are fully frozen:
  # no search, no re-extraction. Empty list = tiering disabled.
  core_topics:
    - running
    - music
    - choir
    - dance
    - hiking
    - cycling
    - fitness
    - board_games
    - volunteering
    - religion
    - senior
    - baby

cache:
  skip_scraped: true
  skip_extracted: true
  search_ttl_days: 3650

schedule:
  # 16:35 UTC = start of DeepSeek's off-peak window (UTC 16:30-00:30, ~50-75% cheaper).
  # Only takes effect when cron_enabled is true.
  cron: "35 16 * * *"
  cron_enabled: false
  auto_run_on_startup: false
