# This file is the single source of truth for runtime settings, and it lives in
# git. Do not edit it through /admin/config — a deploy replaces the container and
# the edit is gone, which is exactly how 2026-08-18's concurrency settings were
# silently lost. Change it here, commit, push; the deploy applies it.
#   "I should be able to walk up with a laptop loaded with only an operating
#    system, and by using the repository, obtain everything I need to build and
#    run the product." — martinfowler.com/articles/continuousIntegration.html

deepseek:
  # 2026-07: DeepSeek retired the "deepseek-chat" model name (supported names:
  # deepseek-v4-pro / deepseek-v4-flash). fingerprint_model pins the extraction
  # cache identity to the old name so the rename does NOT invalidate the whole
  # cache — remove it only if a full re-extraction is intended.
  model: deepseek-v4-flash
  fingerprint_model: deepseek-chat
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 8000
  rate_limit_seconds: 1.0

search:
  results_per_query: 10
  max_pages_per_topic: 5
  rate_limit_seconds: 1.5
  # "live" = instant, $2/1K queries. "standard" = task queue: $0.6/1K normal
  # or $1.2/1K high priority. Manual dashboard runs also use this mode.
  dataforseo_mode: standard
  # 1 = normal queue ($0.6/1K, ~5 min average, 45 min stated target).
  # 2 = priority queue ($1.2/1K, ~1 min). Live mode is $2/1K.
  #
  # We paid double because the collector polled for at most 5 minutes and
  # processed one pair at a time, so a slower queue meant timeouts. Both halves
  # of that are gone: the poll window follows the priority (25 min on normal),
  # and pipeline.search_concurrency overlaps the waits. Switching to 1 halves
  # the search bill — do it together with search_concurrency, never alone.
  standard_priority: 1

fetch:
  timeout_seconds: 15
  min_text_length: 100
  max_concurrent: 3
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - reddit.com
  playwright_domains: []

pipeline:
  # Order the bounded saver windows walk countries in. The window is a hard time
  # box, so a country behind a large unfinished backlog may not be reached at
  # all — this list is the expansion priority. Countries not named here run last,
  # in config order. Hungary leads since the 2026-08-16 import of every 1000+
  # inhabitant settlement (973 new, unprocessed) on the primary market.
  country_priority:
    - Hungary
    - Germany
    - Indonesia
    - Sweden
  # How many pages may have their community extraction in flight at once.
  # 1 = the serial chain: one request at a time across a fleet whose combined
  # ceiling is 185 calls/min, which is why the 2026-08-17 window managed 3.3
  # extractions/min and left 15,690 free calls to expire. Raise to spend the
  # daily budget in hours instead of never; lower to 1 to rule concurrency out
  # when diagnosing. This file is a mounted volume in production, so changing it
  # needs no deploy: edit it at /admin/config, which saves and reloads the
  # runtime config in place. A production copy predating this key gets the
  # default of 1, so shipping the feature turns nothing on by itself.
  extract_concurrency: 4
  # How many pairs may have their *search* in flight at once. The collector
  # spends 45-70s per pair waiting on a queued DataForSEO task, and pairs are
  # independent, so 1 leaves that wait unoverlapped. This is also what makes
  # search.standard_priority: 1 worth having — half the price ($0.6 vs $1.2 per
  # 1K SERPs) for a slower queue only pays off when the waits overlap.
  search_concurrency: 8
  commit_after_run: false
  push_after_commit: false
  test_mode: false
  test_cities:
    - Szentendre
    - Budapest
    - London
  enrich_communities: true
  # Topics searched for cities marked `topic_tier: core` in cities.yaml (small
  # towns where niche topics can't yield results). Tiered-out pairs are fully
  # frozen: no search, no re-extraction. Empty list = tiering disabled.
  #
  # Cut 12 -> 6 on 2026-08-16, from measurement rather than intuition: sampling
  # /api/city-topics across 20 small Hungarian and 20 small German towns gave the
  # SAME top five on both markets (senior, volunteering, choir, religion, dance),
  # with fitness sixth on combined town coverage. The five dropped topics —
  # running, music, hiking, cycling, board_games — each found something in at
  # most a quarter of the sampled towns, and hiking/cycling in almost none.
  # Halving the list roughly halves the DataForSEO bill for the 973 Hungarian
  # settlements added the same day.
  #
  # `hagyomanyorzes` outperformed several of these in Hungary (29 records / 10
  # towns) but scored zero in the German sample, so it stays out of a list that
  # is global. Re-measure before adding a market-specific topic here.
  core_topics:
    - senior
    - volunteering
    - choir
    - religion
    - dance
    - fitness

cache:
  skip_scraped: true
  skip_extracted: true
  search_ttl_days: 3650

schedule:
  # Legacy single combined run (search+extract together). Off by default —
  # the saver twin jobs below are the cost-optimized replacement.
  cron: "35 16 * * *"
  cron_enabled: false
  # ON: a mid-window deploy/restart kills the in-flight saver run; startup then
  # resumes the interrupted search_only/ai_only run boxed to its window. Clean
  # boots do nothing (the crons drive the day) — see _startup_plan in main.py.
  auto_run_on_startup: true
  # ── Twin schedule: extract on a fresh quota day, then collect ──────────────
  # Two independent daily jobs that never overlap.
  #
  # REORDERED 2026-08-16. The old order (collect 01:00→16:20, extract
  # 16:35→00:20) existed for DeepSeek's off-peak discount window. Extraction now
  # runs on the free-tier fleet, whose allowances reset at 00:00 UTC — so the
  # extractor started spending 16 hours after the budget refilled, and anything
  # it could not reach by 00:20 was simply lost. Now it goes first.
  #
  #  * extractor (ai_only): 00:30 → 10:00 UTC, right after the quota reset.
  #    The whole free fleet is ~16.5K calls/day and the chain is serial at
  #    ~2s/call, so spending all of it takes ~9.2h — that is where 9.5h comes
  #    from, not a round number.
  #  * search collector (search_only): 10:30 → 23:50 UTC. DataForSEO only, zero
  #    LLM calls, so it does not compete for the same budget. Its constraint is
  #    money per query, not wall-clock, which is why it takes the longer but
  #    later slot.
  # ── Continuous worker (replaces the twin windows) ─────────────────────────
  # Nothing is clock-bound any more. The worker picks extraction while free
  # quota remains — it expires at 00:00 UTC — and collection once it is gone.
  # Quota returning at midnight is a condition the collector watches for, not a
  # schedule, so extraction resumes on its own. A restart simply starts it
  # again, which is why a deploy no longer costs a collection run.
  #
  # Ops toggle: set false to fall back to the twin crons below, which stay in
  # place until the worker has proven itself and can then be deleted.
  worker_enabled: true
  saver_enabled: true
  extract_cron: "30 0 * * *"
  extract_until: "10:00"
  search_cron: "30 10 * * *"
  search_until: "23:50"
  # ── Managed off-peak description enrichment ────────────────────────────────
  # SEO short/long descriptions generated in DeepSeek's discount window only.
  # Fires at enrich_cron and resumes on startup if a restart lands mid-window;
  # bounded, idempotent/resumable (long_description marker). Coexists with the
  # ai_only extractor and shares its provider budget — the quota ledger reloads
  # periodically so neither job spends the other's allowance blind. Moved with
  # the extractor to the post-reset window. Turn off with enrich_enabled: false.
  enrich_enabled: true
  enrich_cron: "35 0 * * *"
  enrich_until: "10:00"
  enrich_batch_limit: 200
  # Daily summary email (traffic + changes per site + runs). Recipient =
  # REPORT_EMAIL or FEEDBACK_EMAIL env; sent via Resend. 04:30 UTC = 06:30 CEST.
  report_enabled: true
  report_cron: "30 4 * * *"
