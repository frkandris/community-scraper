deepseek:
  model: deepseek-chat
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 8000
  rate_limit_seconds: 1.0

groq:
  model: llama-3.3-70b-versatile
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 3000
  rate_limit_seconds: 7.0

search:
  results_per_query: 10
  max_pages_per_topic: 5
  rate_limit_seconds: 1.5

fetch:
  timeout_seconds: 15
  min_text_length: 100
  max_concurrent: 3
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - reddit.com
  playwright_domains: []

pipeline:
  commit_after_run: false
  push_after_commit: false
  test_mode: false
  test_cities:
    - Szentendre
    - Budapest
    - London
  enrich_communities: true

cache:
  skip_scraped: true
  skip_extracted: true
  search_ttl_days: 7

schedule:
  cron: "* * * * *"
  auto_run_on_startup: true
