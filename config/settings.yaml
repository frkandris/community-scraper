deepseek:
  # 2026-07: DeepSeek retired the "deepseek-chat" model name (supported names:
  # deepseek-v4-pro / deepseek-v4-flash). fingerprint_model pins the extraction
  # cache identity to the old name so the rename does NOT invalidate the whole
  # cache — remove it only if a full re-extraction is intended.
  model: deepseek-v4-flash
  fingerprint_model: deepseek-chat
  temperature: 0.1
  timeout_seconds: 60
  max_text_chars: 8000
  rate_limit_seconds: 1.0

search:
  results_per_query: 10
  max_pages_per_topic: 5
  rate_limit_seconds: 1.5
  # "live" = instant, $2/1K queries. "standard" = task queue: $0.6/1K normal
  # or $1.2/1K high priority. Manual dashboard runs also use this mode.
  dataforseo_mode: standard
  # Normal queue can legally exceed our 5-minute poll window. High priority is
  # ~$1.2/1K (vs $0.6 normal, $2 live) and normally completes within one minute.
  standard_priority: 2

fetch:
  timeout_seconds: 15
  min_text_length: 100
  max_concurrent: 3
  blocked_domains:
    - twitter.com
    - x.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - linkedin.com
    - youtube.com
    - reddit.com
  playwright_domains: []

pipeline:
  # Order the bounded saver windows walk countries in. The window is a hard time
  # box, so a country behind a large unfinished backlog may not be reached at
  # all — this list is the expansion priority. Countries not named here run last,
  # in config order. Hungary leads since the 2026-08-16 import of every 1000+
  # inhabitant settlement (973 new, unprocessed) on the primary market.
  country_priority:
    - Hungary
    - Germany
    - Indonesia
    - Sweden
  commit_after_run: false
  push_after_commit: false
  test_mode: false
  test_cities:
    - Szentendre
    - Budapest
    - London
  enrich_communities: true
  # Topics searched for cities marked `topic_tier: core` in cities.yaml (small
  # towns where niche topics can't yield results). Tiered-out pairs are fully
  # frozen: no search, no re-extraction. Empty list = tiering disabled.
  #
  # Cut 12 -> 6 on 2026-08-16, from measurement rather than intuition: sampling
  # /api/city-topics across 20 small Hungarian and 20 small German towns gave the
  # SAME top five on both markets (senior, volunteering, choir, religion, dance),
  # with fitness sixth on combined town coverage. The five dropped topics —
  # running, music, hiking, cycling, board_games — each found something in at
  # most a quarter of the sampled towns, and hiking/cycling in almost none.
  # Halving the list roughly halves the DataForSEO bill for the 973 Hungarian
  # settlements added the same day.
  #
  # `hagyomanyorzes` outperformed several of these in Hungary (29 records / 10
  # towns) but scored zero in the German sample, so it stays out of a list that
  # is global. Re-measure before adding a market-specific topic here.
  core_topics:
    - senior
    - volunteering
    - choir
    - religion
    - dance
    - fitness

cache:
  skip_scraped: true
  skip_extracted: true
  search_ttl_days: 3650

schedule:
  # Legacy single combined run (search+extract together). Off by default —
  # the saver twin jobs below are the cost-optimized replacement.
  cron: "35 16 * * *"
  cron_enabled: false
  # ON: a mid-window deploy/restart kills the in-flight saver run; startup then
  # resumes the interrupted search_only/ai_only run boxed to its window. Clean
  # boots do nothing (the crons drive the day) — see _startup_plan in main.py.
  auto_run_on_startup: true
  # ── Cost-saver twin schedule (time-rich, money-tight) ──────────────────────
  # Two independent daily jobs that never overlap:
  #  * search collector: search_only mode — DataForSEO (standard, $0.6/1K)
  #    gyűjtöget + fetches pages, ZERO LLM calls. Runs 01:00 → 16:20 UTC.
  #  * off-peak extractor: ai_only mode — DeepSeek runs ONLY on the already
  #    collected pages, inside its discount window (UTC 16:30-00:30, ~50-75%
  #    cheaper). Runs 16:35 → 00:20 UTC, stops gracefully at the window end.
  saver_enabled: true
  search_cron: "0 1 * * *"
  search_until: "16:20"
  extract_cron: "35 16 * * *"
  extract_until: "00:20"
  # ── Managed off-peak description enrichment ────────────────────────────────
  # SEO short/long descriptions generated in DeepSeek's discount window only.
  # Fires at enrich_cron and resumes on startup if a restart lands mid-window;
  # bounded, idempotent/resumable (long_description marker). Coexists with the
  # ai_only extractor. Turn off by setting enrich_enabled: false.
  enrich_enabled: true
  enrich_cron: "30 16 * * *"
  enrich_until: "00:30"
  enrich_batch_limit: 200
  # Daily summary email (traffic + changes per site + runs). Recipient =
  # REPORT_EMAIL or FEEDBACK_EMAIL env; sent via Resend. 04:30 UTC = 06:30 CEST.
  report_enabled: true
  report_cron: "30 4 * * *"
