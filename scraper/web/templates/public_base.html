<!DOCTYPE html>
<html lang="hu" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}kozossegek.com – Találd meg a közösséged{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css" onerror="this.remove()">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  {% block head %}{% endblock %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XD0Z4FE8LX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XD0Z4FE8LX');
  </script>
</head>
<body class="bg-[#FAFAF8] min-h-screen font-sans antialiased text-[#1C1917]">

<header class="bg-white/95 border-b border-[#EAE5DB] sticky top-0 z-20 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
    <a href="/" class="flex items-center gap-2 font-bold text-[#1C1917] text-lg tracking-tight shrink-0">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-md bg-[#A8512F] text-white">
        <i class="ph ph-users-three text-lg"></i>
      </span>
      <span>kozossegek.com</span>
    </a>
    {% set _p = request.url.path %}
    <nav class="flex items-center gap-0.5 shrink-0">
      <div class="flex items-center gap-0.5 overflow-x-auto">
        <a href="/" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors whitespace-nowrap
          {% if _p == '/' or _p.startswith('/explore') %}text-[#1C1917] bg-[#F5F2EC]{% else %}text-[#6A6259] hover:text-[#1C1917] hover:bg-[#F5F2EC]{% endif %}">
          {{ t('nav_discover') }}</a>
        <a href="/map" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors whitespace-nowrap
          {% if _p.startswith('/map') %}text-[#1C1917] bg-[#F5F2EC]{% else %}text-[#6A6259] hover:text-[#1C1917] hover:bg-[#F5F2EC]{% endif %}">
          {{ t('nav_map') }}</a>
        <a href="/about" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors whitespace-nowrap
          {% if _p.startswith('/about') %}text-[#1C1917] bg-[#F5F2EC]{% else %}text-[#6A6259] hover:text-[#1C1917] hover:bg-[#F5F2EC]{% endif %}">
          {{ t('nav_about') }}</a>
      </div>

    </nav>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="mt-16 border-t border-[#EAE5DB] bg-white py-8">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <span class="font-semibold text-[#1C1917] text-sm">kozossegek.com</span>
      <span class="text-xs text-[#8C8478]">· {{ t('footer_tagline') }}</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="/about" class="text-xs text-[#8C8478] hover:text-[#4A4441] transition-colors">{{ t('nav_about') }}</a>
      <a href="/map" class="text-xs text-[#8C8478] hover:text-[#4A4441] transition-colors">{{ t('nav_map') }}</a>
      <a href="/admin" class="text-xs text-[#D8D1C4] hover:text-[#8C8478] transition-colors">Admin</a>
    </div>
  </div>
</footer>

</body>
</html>
