{% extends "base.html" %}
{% block title %}Logs – Community Scraper{% endblock %}
{% block content %}

<div class="flex items-center justify-between mb-4">
  <h1 class="text-2xl font-bold text-gray-900">Logs</h1>
  <div class="flex items-center gap-3">
    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer">
      <input type="checkbox" id="autoScroll" checked class="rounded"> Auto-scroll
    </label>
    <button id="copyBtn" onclick="copyLogs()"
      class="px-3 py-1.5 text-xs text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
      Copy
    </button>
    <button onclick="document.getElementById('log-box').innerHTML=''"
      class="px-3 py-1.5 text-xs text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
      Clear
    </button>
  </div>
</div>

<div id="log-box"
  class="bg-gray-900 rounded-xl p-4 h-[70vh] overflow-y-auto font-mono text-xs leading-relaxed">
</div>

<div class="flex justify-end mt-2">
  <button id="copyBtn2" onclick="copyLogs()"
    class="px-3 py-1.5 text-xs text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50">
    Copy
  </button>
</div>

<script>
const box = document.getElementById('log-box');
const autoScrollCb = document.getElementById('autoScroll');

function scroll() {
  if (autoScrollCb.checked) box.scrollTop = box.scrollHeight;
}

function levelClass(level) {
  if (level === 'warning') return 'text-yellow-400';
  if (level === 'error' || level === 'critical') return 'text-red-400';
  return 'text-green-400';
}

function appendLine(line) {
  const div = document.createElement('div');
  div.className = levelClass(line.level);
  const ts = document.createElement('span');
  ts.className = 'text-gray-500';
  ts.textContent = line.ts;
  div.appendChild(ts);
  div.appendChild(document.createTextNode('  ' + line.text));
  box.appendChild(div);
}

let lastSeq = 0;

fetch('/admin/api/logs/history').then(r => r.json()).then(lines => {
  const frag = document.createDocumentFragment();
  lines.forEach(line => {
    const div = document.createElement('div');
    div.className = levelClass(line.level);
    const ts = document.createElement('span');
    ts.className = 'text-gray-500';
    ts.textContent = line.ts;
    div.appendChild(ts);
    div.appendChild(document.createTextNode('  ' + line.text));
    frag.appendChild(div);
    lastSeq = line.seq;
  });
  box.appendChild(frag);
  scroll();
  startStream();
});

function startStream() {
  const es = new EventSource('/admin/api/logs/stream?last_seq=' + lastSeq);
  es.onmessage = (e) => {
    const line = JSON.parse(e.data);
    lastSeq = line.seq;
    appendLine(line);
    scroll();
  };
  es.onerror = () => {
    const div = document.createElement('div');
    div.className = 'text-gray-600';
    div.textContent = '-- connection closed --';
    box.appendChild(div);
  };
}

function copyLogs() {
  const lines = [...box.querySelectorAll('div')].map(d => d.textContent).join('\n');
  navigator.clipboard.writeText(lines).then(() => {
    ['copyBtn', 'copyBtn2'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
    });
  });
}
</script>

{% endblock %}
