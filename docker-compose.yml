services:
  scraper:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
      - app-config:/app/config
    environment:
      - HOST=0.0.0.0
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting the scraper}
      # Providers (DeepSeek = extraction, DataForSEO = search)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN:-}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD:-}
    restart: unless-stopped

volumes:
  app-data:
  app-config:
